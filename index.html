<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nannette — @nannettethetruthhurts</title>
<meta name="description" content="Nannette — connect on Instagram, TikTok, and Facebook. @nannettethetruthhurts" />
<meta name="theme-color" content="#080808" />
<meta property="og:title" content="Nannette — @nannettethetruthhurts" />
<meta property="og:description" content="Connect with Nannette on Instagram, TikTok, and Facebook." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --black:#080808;
    --black-2:#121212;
    --gold:#C6A568;
    --champagne:#E1C58A;
    --gold-muted:#8D754D;
    --ivory:#F4F0E8;
    --text-2:#A8A39A;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --ease:cubic-bezier(.22,.8,.24,1);
  }
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--black);color:var(--ivory);
    font-family:var(--sans);font-weight:300;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden;}
  ::selection{background:rgba(198,165,104,.35);}
  a{color:inherit;}

  /* ambient card-art backdrop */
  .bg-art{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url('jaxn-card.png') center center/cover no-repeat;
    filter:brightness(.30);
  }
  .bg-scrim{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(8,8,8,.88) 0%,rgba(8,8,8,.30) 26%,
      rgba(8,8,8,.44) 55%,rgba(8,8,8,.94) 82%,#080808 100%);
  }

  .hero{padding:26px 0 8px;perspective:1200px;margin:0 -22px;}
  .card-frame{
    position:relative;transform-style:preserve-3d;
    border-top:1px solid rgba(198,165,104,.45);
    border-bottom:1px solid rgba(198,165,104,.45);
    box-shadow:0 30px 70px rgba(0,0,0,.65);
    transition:transform .5s var(--ease);
    will-change:transform;
  }
  .card-frame img{width:100%;display:block;}
  .card-glare{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%),
      rgba(225,197,138,.20),rgba(225,197,138,.05) 42%,transparent 68%);
    mix-blend-mode:soft-light;transition:opacity .4s ease;
  }
  .card-frame.lit .card-glare{opacity:1;}
  .card-caption{
    margin-top:14px;text-align:center;
    font-size:10px;letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;
    color:var(--gold-muted);
  }

  /* scroll reveals */
  .rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);}
  .rv.in{opacity:1;transform:none;}

  .foil-text{
    background:linear-gradient(105deg,#8D754D 0%,#C6A568 28%,#E1C58A 50%,#C6A568 72%,#8D754D 100%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .label{
    font-size:11px;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
    color:var(--gold-muted);font-weight:500;
  }
  .hairline{
    height:1px;border:0;margin:0;
    background:linear-gradient(90deg,transparent,rgba(198,165,104,.55),transparent);
  }

  /* ================= INTRO — GOLD DIAMOND ================= */
  #intro{
    position:fixed;inset:0;z-index:60;background:#050505;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;cursor:pointer;
    transition:opacity .7s ease,visibility .7s;
  }
  #intro.done{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-halo{
    position:absolute;left:50%;top:44%;width:min(430px,86vw);height:min(430px,86vw);
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(198,165,104,.20),rgba(198,165,104,.05) 55%,transparent 72%);
    filter:blur(4px);opacity:0;animation:haloIn 2.3s var(--ease) both;
  }
  @keyframes haloIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}35%{opacity:1;}100%{opacity:.85;transform:translate(-50%,-50%) scale(1);}}
  .diamond-stage{position:relative;perspective:1100px;width:min(230px,58vw);}
  .diamond-spin{
    transform-style:preserve-3d;
    animation:diamondSpin 2.3s var(--ease) both;
    filter:drop-shadow(0 24px 44px rgba(0,0,0,.75)) drop-shadow(0 0 26px rgba(225,197,138,.28));
  }
  @keyframes diamondSpin{
    0%{transform:rotateY(0deg) scale(.55);opacity:0;}
    18%{opacity:1;}
    70%{transform:rotateY(648deg) scale(1.02);opacity:1;}
    100%{transform:rotateY(720deg) scale(1);opacity:1;}
  }
  .diamond-spin svg{width:100%;height:auto;display:block;}
  .facet{stroke:var(--gold);stroke-width:2;stroke-linejoin:round;}
  .facet-line{stroke:rgba(225,197,138,.75);stroke-width:1.1;}
  .sparkle{
    position:absolute;color:var(--champagne);opacity:0;pointer-events:none;
    animation:twinkle 1.5s ease-in-out infinite;
  }
  .sparkle svg{display:block;}
  .sparkle.s1{top:2%;left:6%;width:18px;animation-delay:.55s;}
  .sparkle.s2{top:12%;right:2%;width:13px;animation-delay:.95s;}
  .sparkle.s3{bottom:16%;left:0%;width:12px;animation-delay:1.3s;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.5) rotate(0deg);}50%{opacity:1;transform:scale(1) rotate(45deg);}}
  .intro-brand{margin-top:40px;text-align:center;opacity:0;animation:introBrand .8s var(--ease) .95s both;}
  @keyframes introBrand{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .intro-brand .t{
    font-family:var(--serif);font-weight:600;font-size:27px;
    letter-spacing:.34em;text-indent:.34em;color:var(--ivory);
  }
  .intro-brand .s{
    margin-top:11px;font-size:11px;letter-spacing:.3em;text-indent:.3em;
    text-transform:uppercase;color:var(--gold-muted);font-weight:500;
  }
  #skipIntro{
    position:absolute;top:calc(20px + env(safe-area-inset-top));right:22px;
    background:none;border:0;cursor:pointer;
    font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-indent:.32em;
    text-transform:uppercase;color:var(--gold-muted);padding:10px 4px;
  }
  #skipIntro:hover{color:var(--champagne);}
  #skipIntro:focus-visible{outline:1px solid var(--gold);outline-offset:4px;}

  /* ================= PROFILE ================= */
  #profile{opacity:0;position:relative;z-index:1;}
  #profile.ready{opacity:1;transition:opacity .6s ease;}
  .wrap{width:min(480px,100%);margin:0 auto;padding:0 22px;box-sizing:border-box;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 0 14px;
  }
  .topbar .brand{font-size:11px;letter-spacing:.4em;text-indent:.1em;color:var(--ivory);font-weight:500;}
  .topbar .mark{
    width:9px;height:9px;transform:rotate(45deg);flex:0 0 9px;
    border:1px solid var(--gold);
  }

  .identity{text-align:center;padding:34px 0 6px;}
  .emblem{
    width:15px;height:15px;margin:0 auto 24px;transform:rotate(45deg);
    border:1px solid var(--gold);
    background:linear-gradient(135deg,rgba(225,197,138,.85),rgba(141,117,77,.35));
    box-shadow:0 0 18px rgba(198,165,104,.45);
  }
  .identity h1{
    font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.05;
    letter-spacing:.05em;margin:0 0 12px;color:var(--ivory);
  }
  .identity .handle{
    font-size:12px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    color:var(--gold);font-weight:500;margin:0 0 16px;word-break:break-all;
  }
  .identity .rule{margin:24px auto 0;max-width:220px;}

  .actions{display:flex;flex-direction:column;gap:12px;padding:30px 0 6px;}
  .btn{
    display:flex;align-items:center;gap:16px;width:100%;box-sizing:border-box;
    padding:17px 18px;border-radius:12px;text-decoration:none;cursor:pointer;
    background:linear-gradient(180deg,#161616,#0e0e0e);
    border:1px solid rgba(198,165,104,.32);
    color:var(--ivory);font-family:var(--sans);
    transition:border-color .3s var(--ease),transform .18s var(--ease),box-shadow .3s var(--ease),background .3s,opacity .6s var(--ease);
    text-align:left;
  }
  #profile .btn{opacity:0;transform:translateY(16px);}
  #profile.ready .btn{opacity:1;transform:none;}
  #profile.ready .btn:nth-child(1){transition-delay:0s,.0s,0s,0s,.05s;}
  #profile.ready .btn:nth-child(2){transition-delay:0s,0s,0s,0s,.16s;}
  #profile.ready .btn:nth-child(3){transition-delay:0s,0s,0s,0s,.27s;}
  .btn:hover,.btn:focus-visible{
    border-color:rgba(225,197,138,.85);
    box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(225,197,138,.25);
    outline:none;
  }
  #profile.ready .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(.995);}
  .btn .ic{
    width:42px;height:42px;flex:0 0 42px;border-radius:50%;
    border:1px solid rgba(198,165,104,.45);
    display:flex;align-items:center;justify-content:center;color:var(--gold);
  }
  .btn .ic svg{width:20px;height:20px;}
  .btn .tx{flex:1;min-width:0;}
  .btn .tx b{display:block;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;}
  .btn .tx span{display:block;font-size:12px;color:var(--text-2);margin-top:4px;letter-spacing:.03em;}
  .btn .ar{
    color:var(--gold);font-size:20px;font-weight:300;line-height:1;
    transition:transform .3s var(--ease);
  }
  .btn:hover .ar{transform:translateX(4px);}

  footer{padding:44px 0 calc(34px + env(safe-area-inset-bottom));text-align:center;}
  footer .f-brand{font-size:11px;letter-spacing:.4em;text-indent:.4em;color:var(--ivory);font-weight:500;}
  footer .f-tag{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text-2);margin:10px 0 0;}
  footer .f-replay{
    margin-top:18px;background:none;border:0;cursor:pointer;
    font-family:var(--sans);font-size:10px;letter-spacing:.3em;text-indent:.3em;
    text-transform:uppercase;color:var(--gold-muted);padding:8px 4px;
  }
  footer .f-replay:hover{color:var(--champagne);}

  @media (min-width:640px){
    .identity h1{font-size:54px;}
  }
  @media (prefers-reduced-motion:reduce){
    .diamond-spin,.intro-halo,.intro-brand,.sparkle{animation:none;opacity:1;}
    #profile .btn{opacity:1;transform:none;}
    .rv{opacity:1;transform:none;transition:none;}
  }
</style>
<noscript><style>#intro{display:none;}#profile{opacity:1;}#profile .btn{opacity:1;transform:none;}</style></noscript>
</head>
<body class="locked">

<div class="bg-art" aria-hidden="true"></div>
<div class="bg-scrim" aria-hidden="true"></div>

<!-- ============ INTRO — GOLD DIAMOND ============ -->
<div id="intro" role="presentation" aria-label="Intro">
  <button id="skipIntro" type="button">Skip Intro</button>
  <div class="intro-halo" aria-hidden="true"></div>
  <div class="diamond-stage" aria-hidden="true">
    <div class="diamond-spin">
      <svg viewBox="0 0 200 160" role="img" aria-label="Gold diamond">
        <defs>
          <linearGradient id="goldFace" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E1C58A" stop-opacity=".95"/>
            <stop offset=".5" stop-color="#C6A568" stop-opacity=".55"/>
            <stop offset="1" stop-color="#8D754D" stop-opacity=".8"/>
          </linearGradient>
          <linearGradient id="goldFace2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#C6A568" stop-opacity=".35"/>
            <stop offset="1" stop-color="#E1C58A" stop-opacity=".75"/>
          </linearGradient>
        </defs>
        <!-- crown -->
        <polygon class="facet" points="62,18 138,18 168,58 32,58" fill="url(#goldFace)"/>
        <!-- pavilion -->
        <polygon class="facet" points="32,58 168,58 100,142" fill="url(#goldFace2)"/>
        <!-- pavilion facets -->
        <polygon points="32,58 76,58 100,142" fill="#E1C58A" opacity=".28"/>
        <polygon points="124,58 168,58 100,142" fill="#8D754D" opacity=".30"/>
        <!-- crown facets -->
        <polygon points="62,18 84,18 76,58 32,58" fill="#F4F0E8" opacity=".14"/>
        <polygon points="116,18 138,18 168,58 124,58" fill="#F4F0E8" opacity=".10"/>
        <!-- facet lines -->
        <line class="facet-line" x1="84" y1="18" x2="76" y2="58"/>
        <line class="facet-line" x1="116" y1="18" x2="124" y2="58"/>
        <line class="facet-line" x1="100" y1="18" x2="100" y2="58"/>
        <line class="facet-line" x1="32" y1="58" x2="168" y2="58"/>
        <line class="facet-line" x1="76" y1="58" x2="100" y2="142"/>
        <line class="facet-line" x1="124" y1="58" x2="100" y2="142"/>
        <line class="facet-line" x1="100" y1="58" x2="100" y2="142"/>
      </svg>
    </div>
    <span class="sparkle s1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg></span>
    <span class="sparkle s2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg></span>
    <span class="sparkle s3"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg></span>
  </div>
  <div class="intro-brand">
    <div class="t">NANNETTE</div>
    <div class="s">@nannettethetruthhurts</div>
  </div>
</div>

<!-- ============ PROFILE ============ -->
<main id="profile">
  <div class="wrap">
    <div class="topbar">
      <span class="brand">JAXN&nbsp;BLACK&nbsp;CARD</span>
      <span class="mark" aria-hidden="true"></span>
    </div>

    <section class="hero rv" aria-label="JAXN BLACK CARD">
      <div class="card-frame" id="cardFrame">
        <img src="jaxn-card.png" alt="JAXN BLACK CARD — matte black card with gold JX monogram" />
        <div class="card-glare" id="cardGlare"></div>
      </div>
      <p class="card-caption">Member Card &mdash; NFC Enabled</p>
    </section>

    <section class="identity">
      <div class="emblem" aria-hidden="true"></div>
      <h1>Nannette</h1>
      <p class="handle">@nannettethetruthhurts</p>
      <hr class="hairline rule" />
    </section>

    <nav class="actions" aria-label="Nannette's links">
      <a class="btn" href="https://www.instagram.com/nannettethetruthhurts/" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="tx"><b>Instagram</b><span>@nannettethetruthhurts</span></span>
        <span class="ar" aria-hidden="true">&rsaquo;</span>
      </a>

      <a class="btn" href="https://www.tiktok.com/@nannettethetruthhurts" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.2 1.8 3.6 4 3.9v3c-1.6 0-3-.5-4-1.3v6.6c0 3.4-2.4 5.8-5.7 5.8A5.6 5.6 0 0 1 5.2 15c0-3.2 2.6-5.7 6-5.5v3.1c-1.5-.3-2.9.8-2.9 2.4 0 1.4 1.1 2.5 2.5 2.5 1.6 0 2.7-1.1 2.7-2.9V3h3.1z"/></svg>
        </span>
        <span class="tx"><b>TikTok</b><span>@nannettethetruthhurts</span></span>
        <span class="ar" aria-hidden="true">&rsaquo;</span>
      </a>

      <a class="btn" href="https://www.facebook.com/nannettethetruthhurts1" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.5-1 .9-1H17V2.5h-2.9C11.2 2.5 10 4.4 10 6.5v2H7.5V12H10v9.5h4V12h2.7l.4-3.5H14z"/></svg>
        </span>
        <span class="tx"><b>Facebook</b><span>nannettethetruthhurts1</span></span>
        <span class="ar" aria-hidden="true">&rsaquo;</span>
      </a>
    </nav>

    <footer>
      <div class="f-brand">JAXN&nbsp;BLACK&nbsp;CARD</div>
      <p class="f-tag">An Introduction Beyond Ordinary.</p>
      <button class="f-replay" id="replayIntro" type="button">Replay Intro</button>
    </footer>
  </div>
</main>

<script>
(function(){
  var intro = document.getElementById('intro');
  var profile = document.getElementById('profile');
  var skipBtn = document.getElementById('skipIntro');
  var replayBtn = document.getElementById('replayIntro');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen = false;
  try { seen = sessionStorage.getItem('nannette-intro-seen') === '1'; } catch(e) {}
  var INTRO_MS = reduced ? 60 : (seen ? 1100 : 2450);
  var ended = false, timer = null;

  function endIntro(){
    if (ended) return;
    ended = true;
    if (timer) clearTimeout(timer);
    intro.classList.add('done');
    document.body.classList.remove('locked');
    profile.classList.add('ready');
    try { sessionStorage.setItem('nannette-intro-seen','1'); } catch(e) {}
  }
  function playIntro(){
    ended = false;
    intro.classList.remove('done');
    document.body.classList.add('locked');
    profile.classList.remove('ready');
    // restart CSS animations by cloning the stage
    var stage = intro.querySelector('.diamond-stage');
    var clone = stage.cloneNode(true);
    stage.replaceWith(clone);
    var brand = intro.querySelector('.intro-brand');
    var brandClone = brand.cloneNode(true);
    brand.replaceWith(brandClone);
    timer = setTimeout(endIntro, INTRO_MS);
  }

  timer = setTimeout(endIntro, INTRO_MS);
  setTimeout(endIntro, 4200); // hard safety: never trap the visitor
  intro.addEventListener('click', endIntro);
  skipBtn.addEventListener('click', function(e){ e.stopPropagation(); endIntro(); });
  if (replayBtn) replayBtn.addEventListener('click', playIntro);

  /* ---------- card tilt + glare (same as the Jaxn template) ---------- */
  var frame = document.getElementById('cardFrame');
  if (frame && !reduced) {
    frame.addEventListener('pointermove', function(e){
      var r = frame.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      frame.style.transform = 'rotateY(' + ((x - .5) * 10) + 'deg) rotateX(' + ((.5 - y) * 8) + 'deg)';
      frame.style.setProperty('--gx', (x * 100) + '%');
      frame.style.setProperty('--gy', (y * 100) + '%');
      frame.classList.add('lit');
    });
    frame.addEventListener('pointerleave', function(){
      frame.style.transform = '';
      frame.classList.remove('lit');
    });
  }

  /* ---------- scroll reveals ---------- */
  var rvEls = document.querySelectorAll('.rv');
  if ('IntersectionObserver' in window && !reduced) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: .12 });
    rvEls.forEach(function(el){ io.observe(el); });
  } else {
    rvEls.forEach(function(el){ el.classList.add('in'); });
  }
})();
</script>
</body>
</html>
